name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    # Windows is a release target with its own code paths (junctions, drive
    # letters, PowerShell, cross-volume moves), so test there too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go build
        run: go build ./...
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build MUDP binary
        run: go build -o dist/mudp-linux-amd64 ./cmd/mudp
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium
      - name: Run E2E tests
        working-directory: web
        run: npm run test:e2e
