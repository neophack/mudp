# 双臂路由拓扑:openwrt 挂两张 docker network,物理上彻底分离 WAN/LAN:
#   wan_net  = 普通 bridge(10.210.2.0/24,能经宿主出公网)→ openwrt 的 WAN 口
#   lan_net  = Internal bridge(10.210.1.0/24,docker 不 NAT,也不下发默认路由)→ openwrt 的 LAN 口
#
# 为什么 lan_net 必须 internal(关键,实测确认):
#   普通 bridge 自带出站 NAT —— 容器挂上去不经 openwrt 就能出公网,openwrt 的防火墙
#   形同虚设、隔离失效。只有 internal 网络(docker 不 NAT、不给默认路由)才能让 openwrt
#   成为容器"唯一"的出口,防火墙的 Drop-LAN-to-RFC1918 规则才真正生效。
#   代价:internal 不下发默认路由,业务容器需 1 行 `ip route add default via 10.210.1.2`。
#   这是 mudp 平台(mudp-mesh 也是 internal)的同款逻辑。
#
# IP 约定(避免 ARP 抢占 —— 实测踩坑):
#   lan_net gateway = 10.210.1.1(docker bridge 占,宿主侧)。openwrt br-lan 用 10.210.1.2,
#   两个 IP 不重叠,不存在"host bridge 抢答 .2 的 ARP"导致 LuCI/网关不可达的问题。
#
# LuCI 访问:
#   端口 18080:80 发布在 wan_net 侧(普通 bridge)。实测普通 bridge 的 docker 端口转发稳定;
#   internal 网络上发不了端口。从 wan_net 进 LuCI,firewall 的 Allow-LuCI 规则放行。
#
# WAN/LAN 接反:openwrt 镜像内置 /etc/uci-defaults/10-mudp-detect-wanlan 按子网探测校正。

services:
  openwrt:
    build:
      context: ./docker/openwrt
    image: mudp/openwrt:dual-arm
    container_name: openwrt

    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW

    restart: unless-stopped

    ports:
      - "18080:80"

    networks:
      wan_net:
        ipv4_address: 10.210.2.2     # WAN:固定,经宿主 docker bridge 出公网
      lan_net:
        ipv4_address: 10.210.1.2     # LAN:固定 .2(gateway 是 .1,不冲突)

  myapp:
    image: nicolaka/netshoot
    container_name: myapp

    depends_on:
      - openwrt

    # internal 网络不下发默认路由,需 NET_ADMIN 加一条指向 openwrt 的默认路由 + DNS。
    # 仅此 2 行(远比单臂的 modprobe/ip link add eth0.10/改路由简单)。
    cap_add:
      - NET_ADMIN

    networks:
      lan_net:
        ipv4_address: 10.210.1.10    # 只挂 LAN

    command: >
      sh -c "
      ip route add default via 10.210.1.2 &&
      echo 'nameserver 10.210.1.2' > /etc/resolv.conf &&
      echo '=== myapp 经 openwrt(internal LAN, 真隔离)出网 ===' &&
      ip route show default &&
      echo '=== 等 openwrt 就绪(DNS/转发, 重试 90s) ===' &&
      ok=0; for i in $$(seq 1 90); do
        if nslookup www.baidu.com 10.210.1.2 >/dev/null 2>&1; then ok=1; break; fi;
        sleep 1;
      done &&
      [ \"$$ok\" = 1 ] && echo \"DNS ready after $${i}s\" || { echo 'DNS not ready'; exit 1; } &&
      echo '=== ping 公网(经 openwrt NAT) ===' &&
      ping -c 3 8.8.8.8 &&
      echo '=== HTTP/HTTPS 出网 ===' &&
      curl -sS -o /dev/null -w 'HTTP %{http_code} %{time_total}s\n' --max-time 10 http://www.baidu.com &&
      curl -sS -o /dev/null -w 'HTTPS %{http_code} %{time_total}s\n' --max-time 10 https://www.baidu.com &&
      echo '=== 隔离验证:私网应被挡 ===' &&
      ping -c 2 -W 2 192.168.1.1 && echo 'WARN:私网未隔离!' || echo 'OK:192.168 私网被挡' &&
      echo '=== ALL TESTS PASSED ===' && sleep 3600
      "

networks:
  wan_net:
    # 普通 bridge:docker 会给它做 NAT/出公网,作为 openwrt 的 WAN 侧 + LuCI 端口发布点。
    driver: bridge
    ipam:
      config:
        - subnet: 10.210.2.0/24
          gateway: 10.210.2.1

  lan_net:
    # ★ Internal:true —— docker 不给此网络做 NAT,也不下发默认路由。
    #   这是"openwrt 成为唯一出口、隔离真有效"的必要条件。
    #   gateway=10.210.1.1(docker bridge 占),openwrt br-lan=10.210.1.2,两者不冲突。
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.210.1.0/24
          gateway: 10.210.1.1
