# /etc/modprobe.d/mudp-blacklist-br_netfilter.conf
#
# 永久禁用 br_netfilter 自动加载。
#
# 根因诊断(实测确认,双臂拓扑期):本镜像把完整 OpenWrt(netifd + br-lan 桥)塞进
# Docker 容器,br-lan 是容器内部的 Linux bridge,eth0.10(VLAN 子接口)是它的
# 成员端口。而 Docker 的 trunk_net 本身又是一个 bridge。于是出现"桥中桥"的
# 嵌套结构。
#
# 当 br_netfilter 模块加载时(bridge-nf-call-iptables=1),内核会把流经 br-lan 的
# 二层帧也提交给 iptables 处理。这时:
#   - 目的 IP 是公网(如 8.8.8.8)的转发包,在 iptables 看到时 iifname 是物理口
#     eth0.10,而 fw3 的 zone 分发规则匹配的是 br-lan,匹配不上 → 转发包进不了
#     FORWARD 链(zone_lan_forward 0 命中) → 被默认 DROP/reject。
#   - 结果:VLAN10 LAN 上的容器(myapp)ping 网关能通(二层直连),但 ping 任何需要
#     经 openwrt 三层转发的公网地址全部超时。
#
# 卸载 br_netfilter 后:二层桥转发的帧不再经过 iptables,需要路由转发的包正常
# 上交三层走 FORWARD 链 → lan→wan forwarding + MASQUERADE 正常生效 → myapp 出网。
# 实测:rmmod br_netfilter 后 myapp ping/curl/DNS 全部恢复 0% loss。
#
# 用 blacklist 而非 install:某些内核下 blacklist 对依赖加载不可靠,故另配
# /etc/init.d/mudp-no-brnf 在每次启动时 rmmod 兜底(见该脚本注释)。
blacklist br_netfilter
